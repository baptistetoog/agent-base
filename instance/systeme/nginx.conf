# agentforma.toog-expertise.app -> 127.0.0.1:4910 (service agentforma-app, voir /home/agentforma/PROJET.md)
server {
    listen 80;
    listen [::]:80;
    server_name agentforma.toog-expertise.app;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://agentforma.toog-expertise.app$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agentforma.toog-expertise.app;

    ssl_certificate     /etc/letsencrypt/live/agentforma.toog-expertise.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentforma.toog-expertise.app/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    # Le serveur Node pose deja certains en-tetes : on garde ceux de nginx pour eviter les doublons
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4910;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # temps reel (Server-Sent Events) : pas de mise en tampon, delai long
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 1h;
    }
}
